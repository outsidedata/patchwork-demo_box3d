<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>demo_box3d dev</title>
    <style>
      /* The scene is laid out in the window less the panel's column on the right (lil-gui's own width,
         245px), and shrunk to fit it when the window is narrower, so no part of it is under the panel. */
      body { margin: 0; background: #0b0b0e; display: grid; place-items: center; height: 100vh; padding-right: 245px; box-sizing: border-box; grid-template-columns: minmax(0, 1fr) }
      canvas { grid-area: 1 / 1; max-width: 100%; max-height: 100vh; width: auto; height: auto }
      .lil-gui.root { max-height: 100vh; overflow-y: auto }
    </style>
  </head>
  <body>
    <script type="module">
      // The demo of box3d: index.html, the manager truth and the scenes its row names all in this tab,
      // one seat on them over a loopback, stepped on the page's clock, and a panel holding every number
      // of `world.box3d` and the render3d settings that change how it looks or what it costs.
      // `?scene=<scene>` enters that scene. The truths are kept on `window.__scenes` and the page on
      // `window.__page` for the profilers (benchmarking-a-game). The frame rate is three's stats panel,
      // the stats plugin, at the top left.
      //
      // The keys are the testbed's own (devBinds, below), so no click takes the pointer and the panel is
      // clicked freely: W and S fly forward and back, A and D turn left and right, E and Q tilt up and
      // down, Shift climbs and Control sinks, the wheel, turned anywhere but over the panel, paces, and
      // the player's own `fire` and `blast` keys (`assets/demo_box3d.json`) fire a ball from the eye and
      // set off an explosion where it looks.
      //
      // The panel tweaks a copy of the scene's `world.box3d`, laid into the truth's world and the page's
      // a quarter second after the last change, each part the way box3d takes it:
      // - the world's own numbers (gravity, substeps, the contact's hertz, damping and speed, the
      //   thresholds, the speed cap, sleep, continuous collision, warm starting, speculative contacts,
      //   the recycle distance) are written onto the scene's `box3d` row, which box3d pushes into the
      //   live world the step they differ, and every body is woken so the change shows on what was at
      //   rest;
      // - each joint kind's numbers are written onto every row of that kind, which box3d pushes into the
      //   live joint;
      // - each body kind's density, friction, restitution, rolling resistance and damping, and the
      //   floor's, the ramp's and the platform's friction and restitution, are read by box3d only when it
      //   makes a body, so a change to any of them makes the world again: the `box3d` row is ended and a
      //   row of its fields spawned in its place, whose first step builds a new Box3D world from
      //   `world.box3d`, every body and joint where its row stands, moving as it moved.
      // The explosion's `radius`, `falloff` and `impulse`, the arguments box3d's `explode` takes, are the
      // blast's definition, changed in the tab's one copy of the definitions. Nothing is written to disk:
      // `copy box3d JSON` copies the panel's `world.box3d`, for the scene file, and `reset to the file`
      // puts the file's back.
      //
      // The render3d folder: the pixel ratio, drawn smooth or as blocks; the exposure and the tone
      // mapping; the shadows, the AO and the bloom on or off, which load the page again with `?shadows=`,
      // `?ao=` and `?bloom=`, since the renderer's shadow map, its reversed depth and its composer are
      // fixed when it is made; and the AO's and the bloom's numbers, on their passes as they draw.
      import { boot } from '#engine/engine.ts'
      import { accept, load, manager, link, view } from '#addons/scenemanager/scenemanager.addon.ts'
      import { loopback } from '#addons/loopback/loopback.addon.ts'
      import { prepared } from '#plugins/loader/loader.sim.ts'
      import GUI from 'lil-gui'
      import { sim } from './demo_box3d.sim.ts'
      import { scene as main } from './main.sim.ts'
      import file from './demo_box3d.scene.json'

      const clone = v => JSON.parse(JSON.stringify(v))
      const params = new URLSearchParams(location.search)
      file.prefabs.scenemanager.entry = params.get('scene') ?? file.prefabs.scenemanager.entry
      // The shadows, the AO and the bloom, on or off from the address, before the renderer is made.
      const r3 = main.prefabs.render3d
      const fileBloom = clone(r3.bloom)
      if (params.has('shadows')) r3.shadows = params.get('shadows')
      if (params.has('ao')) r3.ao.on = params.get('ao') === '1'
      if (params.get('bloom') === '0') delete r3.bloom
      // The file's numbers, as they were, for `reset to the file`.
      const fileOwn = clone(main.world.box3d)
      // The tab's one copy of the definitions, which every rule and look reads.
      const defs = await prepared(main.world, main.world.defs)
      const fileBlast = clone(defs.blast)

      const dt = file.prefabs.engine.dt
      const truth = boot(file, sim)
      window.__scenes = await load(truth, import.meta.url)
      let client
      // The testbed's own keys, bound in place of whatever the seat's look binds.
      const TURN = 1.4, TILT = 0.9 // radians a second
      let turned = performance.now()
      const devBinds = {
        stick: [{ keys: ['F13', 'F14', 'w', 's'], send: (x, y) => ['stick', x, y] }],
        hold: [
          { keys: ['Shift'], send: v => ['up', v] },
          { keys: ['Control'], send: v => ['down', v] },
        ],
        press: { [defs.player.keys.fire]: ['fire'], [defs.player.keys.blast]: ['blast'] },
        every: held => {
          const now = performance.now(), dt = Math.min((now - turned) / 1000, 0.1)
          turned = now
          const yaw = (held('a') ? 1 : 0) - (held('d') ? 1 : 0), pitch = (held('q') ? 1 : 0) - (held('e') ? 1 : 0)
          return yaw || pitch ? ['look', yaw * TURN * dt, pitch * TILT * dt] : undefined
        },
        wheel: dy => ['pace', dy],
      }
      const page = view(link(loopback(accept(manager(truth)))), file, import.meta.url, (me, scene) => {
        client = me
        const player = me.plugins.player
        if (player) { const bind = player.bind.bind(player); player.bind = () => bind(devBinds) }
        for (const surface of [me.plugins.render3d ?? me.plugins.render2d, me.plugins.ui]) {
          if (!surface) continue
          const canvas = document.createElement('canvas')
          canvas.width = scene.prefabs.engine.width
          canvas.height = scene.prefabs.engine.height
          document.body.appendChild(canvas)
          surface.mount(canvas)
        }
        me.plugins.stats?.mount(document.body)
      })
      window.__page = page
      // The truth of the scene the seat is on.
      const room = () => window.__scenes.get(chosen.scene)

      // The panel: the scene, chosen from the manager's table, the page loaded again on it. Keys typed
      // into it and the wheel turned over it reach neither this page nor the eye, so the wheel scrolls
      // the panel.
      const gui = new GUI({ title: 'demo_box3d dev' })
      for (const type of ['keydown', 'keyup', 'wheel']) gui.domElement.addEventListener(type, e => e.stopPropagation())
      const chosen = { scene: file.prefabs.scenemanager.entry }
      const reload = (key, value) => {
        const url = new URL(location.href)
        url.searchParams.set(key, value)
        location.href = url.href
      }
      gui.add(chosen, 'scene', Object.keys(file.prefabs.scenemanager.scenes)).onChange(s => reload('scene', s))

      // ---------- box3d ----------

      // The panel's copy of world.box3d.
      const own = clone(fileOwn)
      // The world's fields a live world takes off the box3d row.
      const LIVE = ['gravity', 'subStepCount', 'contactHertz', 'contactDampingRatio', 'contactSpeed', 'restitutionThreshold', 'hitEventThreshold',
        'maximumLinearSpeed', 'enableSleep', 'enableContinuous', 'enableWarmStarting', 'enableSpeculative', 'contactRecycleDistance']
      // What box3d reads only when it makes a body: the kinds' and the statics' shapes and bodies.
      const made = () => JSON.stringify([own.kinds, own.static])
      let built = made()
      // The panel's copy laid into the truth's world and the page's a quarter second after the last
      // change: the world's live fields onto the box3d row, each joint kind's onto its rows, and the
      // world made again when what box3d reads only when it makes a body changed.
      let timer
      const apply = () => {
        clearTimeout(timer)
        timer = setTimeout(() => {
          const truthOf = room()
          for (const world of [truthOf?.world, client?.plugins.wire.scene.world]) if (world) Object.assign(world.box3d, clone(own))
          if (!truthOf) return
          const row = truthOf.rows.find(r => r.kind === 'box3d')
          // A world field changed wakes every body, since Box3D leaves a sleeping body asleep under a
          // new gravity, and the change would show on nothing at rest.
          if (LIVE.some(f => JSON.stringify(row.data[f] ?? fileOwn[f]) !== JSON.stringify(own[f]))) {
            for (const r of truthOf.rows) if (typeof r.data.awake === 'boolean') r.data.awake = true
          }
          for (const f of LIVE) row.data[f] = clone(own[f])
          for (const [kind, joint] of Object.entries(own.joints)) {
            for (const j of truthOf.rows.filter(r => r.kind === kind)) {
              for (const [f, v] of Object.entries(joint)) if (!['type', 'localFrameA', 'localFrameB'].includes(f)) j.data[f] = clone(v)
            }
          }
          const now = made()
          if (now !== built) {
            built = now
            truthOf.end(row)
            truthOf.spawn('box3d', clone(row.data))
          }
        }, 250)
      }
      const num = (folder, o, key, lo, hi, step, name) => folder.add(o, key, lo, hi, step).name(name ?? key).onChange(apply)
      const flag = (folder, o, key, name) => folder.add(o, key).name(name ?? key).onChange(apply)

      // The world: b3WorldDef's fields and the switches b3WorldDef has no field for.
      const wf = gui.addFolder('world')
      num(wf, own.gravity, 0, -30, 30, 0.1, 'gravity x m/s²')
      num(wf, own.gravity, 1, -30, 30, 0.1, 'gravity y m/s²')
      num(wf, own.gravity, 2, -30, 30, 0.1, 'gravity z m/s²')
      num(wf, own, 'subStepCount', 1, 16, 1, 'substeps a step')
      num(wf, own, 'contactHertz', 1, 120, 1, 'contact hertz')
      num(wf, own, 'contactDampingRatio', 0, 20, 0.1, 'contact damping ratio')
      num(wf, own, 'contactSpeed', 0, 20, 0.1, 'contact push-out m/s')
      num(wf, own, 'restitutionThreshold', 0, 10, 0.1, 'restitution threshold m/s')
      num(wf, own, 'hitEventThreshold', 0, 10, 0.1, 'hit event threshold m/s')
      num(wf, own, 'maximumLinearSpeed', 1, 1000, 1, 'max linear speed m/s')
      flag(wf, own, 'enableSleep', 'sleep')
      flag(wf, own, 'enableContinuous', 'continuous collision')
      flag(wf, own, 'enableWarmStarting', 'warm starting')
      flag(wf, own, 'enableSpeculative', 'speculative contacts')
      num(wf, own, 'contactRecycleDistance', 0, 0.2, 0.001, 'contact recycle m')

      // Each body kind: its shape's density and surface, and its body's damping.
      const kf = gui.addFolder('kinds')
      for (const [kind, body] of Object.entries(own.kinds)) {
        if (body.type !== 'dynamic') continue
        const f = kf.addFolder(kind)
        for (const shape of body.shapes) {
          num(f, shape, 'density', 1, 10000, 1, 'density kg/m³')
          num(f, shape.baseMaterial, 'friction', 0, 2, 0.01)
          num(f, shape.baseMaterial, 'restitution', 0, 1, 0.01)
          if ('rollingResistance' in shape.baseMaterial) num(f, shape.baseMaterial, 'rollingResistance', 0, 1, 0.005, 'rolling resistance')
        }
        num(f, body, 'linearDamping', 0, 5, 0.01, 'linear damping')
        num(f, body, 'angularDamping', 0, 5, 0.01, 'angular damping')
        f.close()
      }
      kf.close()

      // The static bodies things rest and roll on: the floor, the ramp and the one-way platform.
      const sf = gui.addFolder('static')
      for (const [i, what] of [[0, 'floor'], [10, 'ramp'], [11, 'platform']]) {
        const material = own.static[i].shapes[0].baseMaterial
        num(sf, material, 'friction', 0, 2, 0.01, `${what} friction`)
        num(sf, material, 'restitution', 0, 1, 0.01, `${what} restitution`)
      }
      sf.close()

      // Each joint kind: the fields of its Box3D joint that a live joint takes.
      const jf = gui.addFolder('joints')
      const hf = jf.addFolder('hinge (revolute)')
      const h = own.joints.hinge
      flag(hf, h, 'enableLimit', 'limit')
      num(hf, h, 'lowerAngle', -3.14, 0, 0.01, 'lower angle rad')
      num(hf, h, 'upperAngle', 0, 3.14, 0.01, 'upper angle rad')
      flag(hf, h, 'enableSpring', 'spring')
      num(hf, h, 'hertz', 0, 10, 0.05)
      num(hf, h, 'dampingRatio', 0, 2, 0.01, 'damping ratio')
      num(hf, h, 'targetAngle', -1.7, 1.7, 0.01, 'target angle rad')
      flag(hf, h, 'enableMotor', 'motor')
      num(hf, h, 'motorSpeed', -10, 10, 0.1, 'motor speed rad/s')
      num(hf, h, 'maxMotorTorque', 0, 5000, 10, 'max motor torque N·m')
      const rf2 = jf.addFolder('rope (distance)')
      const r = own.joints.rope
      num(rf2, r, 'length', 0.5, 4.5, 0.01, 'length m')
      flag(rf2, r, 'enableSpring', 'spring')
      num(rf2, r, 'hertz', 0, 10, 0.05)
      num(rf2, r, 'dampingRatio', 0, 2, 0.01, 'damping ratio')
      flag(rf2, r, 'enableLimit', 'limit')
      num(rf2, r, 'minLength', 0.5, 4.5, 0.01, 'min length m')
      num(rf2, r, 'maxLength', 0.5, 4.5, 0.01, 'max length m')
      const pf = jf.addFolder('spring (wheel)')
      const p = own.joints.spring
      flag(pf, p, 'enableSuspensionSpring', 'suspension spring')
      num(pf, p, 'suspensionHertz', 0, 10, 0.05, 'suspension hertz')
      num(pf, p, 'suspensionDampingRatio', 0, 2, 0.01, 'suspension damping ratio')
      flag(pf, p, 'enableSuspensionLimit', 'suspension limit')
      num(pf, p, 'lowerSuspensionLimit', -0.5, 0, 0.01, 'lower limit m')
      num(pf, p, 'upperSuspensionLimit', 0, 0.5, 0.01, 'upper limit m')
      flag(pf, p, 'enableSpinMotor', 'spin motor')
      num(pf, p, 'spinSpeed', -20, 20, 0.1, 'spin speed rad/s')
      num(pf, p, 'maxSpinTorque', 0, 2000, 10, 'max spin torque N·m')
      const df = jf.addFolder('weld')
      const d = own.joints.weld
      num(df, d, 'linearHertz', 0, 60, 0.5, 'linear hertz (0 rigid)')
      num(df, d, 'angularHertz', 0, 60, 0.5, 'angular hertz (0 rigid)')
      num(df, d, 'linearDampingRatio', 0, 2, 0.01, 'linear damping ratio')
      num(df, d, 'angularDampingRatio', 0, 2, 0.01, 'angular damping ratio')
      num(df, d, 'torqueThreshold', 0, 20000, 50, 'strained past N·m')
      jf.close()

      // The explosion: box3d's `explode` act's arguments, the blast's definition.
      const ef = gui.addFolder('explode')
      ef.add(defs.blast, 'radius', 0.5, 20, 0.1).name('radius m')
      ef.add(defs.blast, 'falloff', 0, 10, 0.1).name('falloff m')
      ef.add(defs.blast, 'impulse', 0, 5000, 10).name('impulse per area N·s/m²')

      gui.add({ copy: () => navigator.clipboard?.writeText(JSON.stringify(own, null, 2)) }, 'copy').name('copy box3d JSON')
      // The file's numbers written into the panel's copy, key by key, so every control keeps its object.
      const into = (to, from) => {
        for (const [k, v] of Object.entries(from)) {
          if (v && typeof v === 'object' && to[k] && typeof to[k] === 'object') into(to[k], v)
          else to[k] = clone(v)
        }
      }
      gui.add({ reset: () => {
        into(own, fileOwn)
        into(defs.blast, fileBlast)
        for (const c of gui.controllersRecursive()) c.updateDisplay()
        apply()
      } }, 'reset').name('reset to the file')

      // ---------- render3d ----------

      const rf = gui.addFolder('render3d')
      const r3d = () => client?.plugins.render3d
      const look = { ratio: r3.pixelRatio ?? 1, blocks: false, exposure: r3.exposure ?? 1, tone: r3.tone ?? 'none', shadows: r3.shadows ?? 'none' }
      const ratio = () => r3d()?.ratio(look.ratio, look.blocks ? 'blocks' : 'smooth')
      rf.add(look, 'ratio', 0.1, 3, 0.05).name('pixel ratio').onChange(ratio)
      rf.add(look, 'blocks').name('pixels as blocks').onChange(ratio)
      rf.add(look, 'exposure', 0, 4, 0.01).onChange(v => {
        const renderer = r3d()?.renderer
        if (renderer) renderer.toneMappingExposure = v
      })
      rf.add(look, 'tone', ['neutral', 'none']).name('tone mapping').onChange(v => {
        const three = r3d()?.THREE, renderer = r3d()?.renderer
        if (renderer) renderer.toneMapping = v === 'neutral' ? three.NeutralToneMapping : three.NoToneMapping
      })
      rf.add(look, 'shadows', ['soft', 'hard', 'none']).onChange(v => reload('shadows', v))
      // The passes of the composer as it draws: the AO's and the bloom's.
      const passOf = has => r3d()?.composer?.passes.find(has)
      const ao = clone(r3.ao)
      const af = rf.addFolder('ao')
      af.add({ on: !!r3.ao.on }, 'on').onChange(v => reload('ao', v ? '1' : '0'))
      const setAo = () => {
        Object.assign(client.plugins.wire.scene.prefabs.render3d.ao, ao)
        const gtao = passOf(p => 'updateGtaoMaterial' in p)
        if (!gtao) return
        gtao.updateGtaoMaterial({ radius: ao.radius, thickness: ao.thickness, distanceFallOff: ao.falloff, scale: ao.scale, samples: ao.samples })
        gtao.blendIntensity = ao.intensity
      }
      af.add(ao, 'radius', 0.01, 10, 0.01).onChange(setAo)
      af.add(ao, 'thickness', 0.01, 5, 0.01).onChange(setAo)
      af.add(ao, 'falloff', 0, 5, 0.01).onChange(setAo)
      af.add(ao, 'scale', 0, 5, 0.01).onChange(setAo)
      af.add(ao, 'intensity', 0, 2, 0.01).onChange(setAo)
      af.add(ao, 'samples', 2, 32, 1).onChange(setAo)
      const bloom = clone(fileBloom)
      const bf = rf.addFolder('bloom')
      bf.add({ on: !!r3.bloom }, 'on').onChange(v => reload('bloom', v ? '1' : '0'))
      const setBloom = () => {
        const prefab = client.plugins.wire.scene.prefabs.render3d
        if (prefab.bloom) Object.assign(prefab.bloom, bloom)
        const pass = passOf(p => 'strength' in p && 'threshold' in p)
        if (!pass) return
        pass.strength = bloom.strength
        pass.radius = bloom.radius
        pass.threshold = bloom.threshold
      }
      bf.add(bloom, 'strength', 0, 3, 0.01).onChange(setBloom)
      bf.add(bloom, 'radius', 0, 1, 0.01).onChange(setBloom)
      bf.add(bloom, 'threshold', 0, 10, 0.05).onChange(setBloom)

      let last = performance.now(), owed = 0
      const loop = async now => {
        owed += Math.min((now - last) / 1000, 0.25)
        last = now
        // A frame that throws is logged, and the next frame goes on.
        try {
          page.input()
          while (owed >= dt) { truth.step(dt); owed -= dt }
          await page.frame(owed / dt)
        } catch (e) { console.error(e) }
        requestAnimationFrame(loop)
      }
      requestAnimationFrame(loop)
    </script>
  </body>
</html>
